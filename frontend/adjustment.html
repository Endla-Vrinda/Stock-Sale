<!DOCTYPE html>
<html>

<head>
    <title>Inventory Adjustment - StockSense</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main>

        <div class="topbar">

            <div>
                <h1>Inventory Adjustment</h1>
                <p>Update stock based on physical count</p>
            </div>

            <a href="operations.html">
                Back to Operations
            </a>

        </div>

        <section class="panel">

            <form id="adjustmentForm">

                <label>
                    Product ID
                </label>

                <input
                    type="number"
                    id="productId"
                    placeholder="Enter product ID"
                    required
                >

                <label>
                    System Quantity
                </label>

                <input
                    type="number"
                    id="systemQuantity"
                    min="0"
                    placeholder="Current system quantity"
                    required
                >

                <label>
                    Physical Count
                </label>

                <input
                    type="number"
                    id="countedQuantity"
                    min="0"
                    placeholder="Enter physical quantity"
                    required
                >

                <label>
                    Reason
                </label>

                <input
                    type="text"
                    id="reason"
                    placeholder="Example: Damaged items"
                    required
                >

                <button type="submit">
                    Apply Adjustment
                </button>

            </form>

            <p id="message"></p>

        </section>

        <section class="panel">

            <h2>Adjustment History</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Product</th>
                        <th>System Qty</th>
                        <th>Counted Qty</th>
                        <th>Difference</th>
                        <th>Reason</th>
                    </tr>

                </thead>

                <tbody id="adjustmentTable">

                    <tr>
                        <td colspan="6">
                            Loading adjustments...
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>

    <script src="js/operations.js"></script>

</body>

</html>
