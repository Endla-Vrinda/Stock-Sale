<!DOCTYPE html>
<html>

<head>
    <title>Dashboard - StockSense</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="sidebar"></div>

    <main>

        <div class="topbar">

            <div>
                <h1>Dashboard</h1>

                <p>
                    Welcome to StockSense
                </p>
            </div>

            <a href="profile.html">
                My Profile
            </a>

        </div>

        <div class="cards">

            <div class="card">
                <span>Total Products</span>
                <b id="totalProducts">0</b>
            </div>

            <div class="card">
                <span>Low Stock</span>
                <b id="lowStock">0</b>
            </div>

            <div class="card">
                <span>Out of Stock</span>
                <b id="outStock">0</b>
            </div>

            <div class="card">
                <span>Pending Receipts</span>
                <b id="receipts">0</b>
            </div>

            <div class="card">
                <span>Pending Deliveries</span>
                <b id="deliveries">0</b>
            </div>

            <div class="card">
                <span>Transfers</span>
                <b id="transfers">0</b>
            </div>

        </div>

        <section class="panel">

            <h2>Low Stock Alerts</h2>

            <div id="alerts">
                Loading...
            </div>

        </section>

        <section class="panel">

            <h2>Recent Movements</h2>

            <div id="movements">
                Loading...
            </div>

        </section>

    </main>

    <script src="js/common.js"></script>
    <script src="js/dashboard.js"></script>

</body>

</html>
