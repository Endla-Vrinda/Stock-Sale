<!DOCTYPE html>
<html>

<head>
    <title>Deliveries - StockSense</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main>

        <div class="topbar">

            <div>
                <h1>Delivery Orders</h1>
                <p>Send products to customers</p>
            </div>

            <a href="operations.html">
                Back to Operations
            </a>

        </div>

        <section class="panel">

            <form id="deliveryForm">

                <label>
                    Customer
                </label>

                <input
                    type="text"
                    id="customer"
                    placeholder="Enter customer name"
                    required
                >

                <label>
                    Product ID
                </label>

                <input
                    type="number"
                    id="productId"
                    placeholder="Enter product ID"
                    required
                >

                <label>
                    Quantity
                </label>

                <input
                    type="number"
                    id="quantity"
                    min="1"
                    placeholder="Enter quantity"
                    required
                >

                <button type="submit">
                    Validate Delivery
                </button>

            </form>

            <p id="message"></p>

        </section>

        <section class="panel">

            <h2>Delivery History</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Customer</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>

                </thead>

                <tbody id="deliveryTable">

                    <tr>
                        <td colspan="4">
                            Loading deliveries...
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>

    <script src="js/operations.js"></script>

</body>

</html>
