<!DOCTYPE html>
<html>

<head>
    <title>Forgot Password - StockSense</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <div class="auth-box">

        <h1>Reset Password</h1>

        <p>
            Enter your email to receive an OTP.
        </p>

        <form id="forgotForm">

            <input
                id="email"
                type="email"
                placeholder="Email"
                required
            >

            <button type="submit">
                Send OTP
            </button>

        </form>

        <p id="message"></p>

        <p>
            <a href="login.html">
                Back to Login
            </a>
        </p>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
