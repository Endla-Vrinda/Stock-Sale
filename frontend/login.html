<!DOCTYPE html>
<html>

<head>
    <title>Login - StockSense</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <div class="auth-box">

        <h1>StockSense</h1>

        <p>Login to your account</p>

        <form id="loginForm">

            <input
                id="email"
                type="email"
                placeholder="Email"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

        <p>
            <a href="signup.html">
                Create Account
            </a>
        </p>

        <p>
            <a href="forgot.html">
                Forgot Password?
            </a>
        </p>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
