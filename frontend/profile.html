<!DOCTYPE html>
<html>

<head>
    <title>My Profile - StockSense</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main>

        <div class="topbar">

            <div>
                <h1>My Profile</h1>
                <p>View your StockSense account details</p>
            </div>

            <a href="dashboard.html">
                Back to Dashboard
            </a>

        </div>

        <section class="panel">

            <h2>Account Information</h2>

            <label>
                Name
            </label>

            <input
                type="text"
                id="profileName"
                readonly
            >

            <label>
                Email
            </label>

            <input
                type="email"
                id="profileEmail"
                readonly
            >

            <button
                type="button"
                onclick="logout()"
            >
                Logout
            </button>

        </section>

    </main>

    <script>

        const email =
            localStorage.getItem("stocksenseUser");

        document.getElementById(
            "profileEmail"
        ).value = email || "Not available";

        function logout()
        {
            localStorage.removeItem(
                "stocksenseUser"
            );

            window.location.href =
                "login.html";
        }

    </script>

</body>

</html>
