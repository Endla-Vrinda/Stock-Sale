<!DOCTYPE html>
<html>

<head>
    <title>Sign Up - StockSense</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <div class="auth-box">

        <h1>Create Account</h1>

        <form id="signupForm">

            <input
                id="name"
                type="text"
                placeholder="Full Name"
                required
            >

            <input
                id="email"
                type="email"
                placeholder="Email"
                required
            >

            <input
                id="password"
                type="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Sign Up
            </button>

        </form>

        <p id="message"></p>

        <p>
            <a href="login.html">
                Already have an account?
            </a>
        </p>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
