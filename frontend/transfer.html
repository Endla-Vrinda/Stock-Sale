<!DOCTYPE html>
<html>

<head>
    <title>Transfers - StockSense</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main>

        <div class="topbar">

            <div>
                <h1>Internal Transfers</h1>
                <p>Move stock between locations</p>
            </div>

            <a href="operations.html">
                Back to Operations
            </a>

        </div>

        <section class="panel">

            <form id="transferForm">

                <label>
                    Product ID
                </label>

                <input
                    type="number"
                    id="productId"
                    placeholder="Enter product ID"
                    required
                >

                <label>
                    Quantity
                </label>

                <input
                    type="number"
                    id="quantity"
                    min="1"
                    placeholder="Enter quantity"
                    required
                >

                <label>
                    From Location
                </label>

                <input
                    type="text"
                    id="fromLocation"
                    placeholder="Enter current location"
                    required
                >

                <label>
                    To Location
                </label>

                <input
                    type="text"
                    id="toLocation"
                    placeholder="Enter new location"
                    required
                >

                <button type="submit">
                    Transfer Stock
                </button>

            </form>

            <p id="message"></p>

        </section>

        <section class="panel">

            <h2>Transfer History</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Product</th>
                        <th>Quantity</th>
                        <th>From</th>
                        <th>To</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody id="transferTable">

                    <tr>
                        <td colspan="6">
                            Loading transfers...
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>

    <script src="js/operations.js"></script>

</body>

</html>
